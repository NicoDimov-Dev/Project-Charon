# Perfect Assassin (1997) - DOSBox Staging config
# Launched by "Play Perfect Assassin.bat" with --noprimaryconf, so only this file applies.

[sdl]
fullscreen = off
window_size = 1280x960

[mouse]
mouse_capture = seamless

[dosbox]
machine = svga_s3
memsize = 32
startup_verbosity = quiet

[render]
aspect = on
integer_scaling = off
shader = sharp

[cpu]
core = normal
cputype = pentium
cpu_cycles = max
cpu_cycles_protected = max

[midi]
# Windows' built-in "Microsoft GS Wavetable Synth" plays the game's General MIDI music.
mididevice = port
mpu401 = intelligent

[sblaster]
sbtype = sb16
sbbase = 220
irq = 5
dma = 1
hdma = 5
oplmode = auto

[dos]
xms = on
ems = on

[autoexec]
@echo off
mount c "C" -freesize 1024
mount d "..\Original\Perfect Assassin Installer" -t cdrom -label PASS
c:
